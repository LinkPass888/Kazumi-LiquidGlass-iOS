name: real_liquid_glass
description: >-
  Kazumi 本地插件：iOS 原生 UIGlassEffect 液态玻璃容器与底部标签栏。从
  real_liquid_glass 0.3.0 fork，剔除了旧系统模糊兜底与 Android/Desktop 的
  Flutter fallback，现仅支持 iOS。
version: 0.4.0-kazumi.1
publish_to: none

environment:
  sdk: ^3.12.1
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: LiquidGlassContainerPlugin

