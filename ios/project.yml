# XcodeGen 工程描述（Windows 环境下唯一的工程事实标准）
#
# 该文件取代 Flutter 时代的 Runner.xcodeproj / Podfile：
#   * 源码全部来自 ios/Runner/NativeApp（纯 Swift 6 + SwiftUI）
#   * 图标与启动图沿用 ios/Runner/Assets.xcassets（AppIcon.appiconset 未被改动）
#   * 根目录 assets/ 以 folder reference 形式原样打进 Bundle，供 Anime4K 着色器与内置规则复用
#
# 生成工程：xcodegen generate --spec ios/project.yml --project ios
# 产物路径：ios/Runner.xcodeproj，scheme 名称与包名保持 Runner / com.example.kazumi

name: Runner

options:
  bundleIdPrefix: com.example
  # 与 Flutter 原工程一致的部署版本（iOS 26 原生液态玻璃 API 需要）。
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  groupSortPosition: top
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
    GCC_C_LANGUAGE_STANDARD: gnu17
    ENABLE_BITCODE: NO
    # KSPlayer 的 FFmpeg / mpv 静态库体积较大，保留完整的调试符号映射。
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

packages:
  Fuzi:
    url: https://github.com/cezheng/Fuzi.git
    from: 3.1.3
  KSPlayer:
    url: https://github.com/kingslay/KSPlayer.git
    from: 2.1.0

targets:
  Runner:
    type: application
    platform: iOS
    deploymentTarget: "26.0"

    sources:
      # 纯 SwiftUI 业务代码。
      - path: Runner/NativeApp
      # 图标 / 启动图资源目录，原样编译进 Assets.car（AppIcon.appiconset 不做任何改动）。
      - path: Runner/Assets.xcassets
        buildPhase: resources
      # 启动屏 storyboard，只引用 Assets.xcassets 中的图片。
      - path: Runner/Base.lproj
        buildPhase: resources
      # 根目录静态资源：Anime4K .glsl 着色器、内置默认规则 .json、图片。
      # 使用 folder reference 保留目录结构，运行时通过 Bundle 路径读取。
      - path: ../assets/shaders
        type: folder
        buildPhase: resources
      - path: ../assets/images
        type: folder
        buildPhase: resources
      - path: ../assets/statements
        type: folder
        buildPhase: resources
      - path: ../licenses
        type: folder
        buildPhase: resources
        optional: true

    info:
      path: Runner/Info.plist
      properties:
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        CFBundleDisplayName: Kazumi
        CFBundleName: kazumi
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleSignature: "????"
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIApplicationSupportsIndirectInputEvents: true
        UIStatusBarHidden: false
        UIViewControllerBasedStatusBarAppearance: true
        CADisableMinimumFrameDurationOnPhone: true
        UIBackgroundModes:
          - audio
        LSApplicationQueriesSchemes:
          - vlc-x-callback
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsArbitraryLoadsInWebContent: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: >-
          用于在局域网内发现并投屏到电视（DLNA / AirPlay），以及「一起看」房间的局域网直连。
        NSBonjourServices:
          - _airplay._tcp
          - _raop._tcp
          - _googlecast._tcp
          - _dlna._tcp
        NSCameraUsageDescription: 用于以图搜番时直接拍照识别番剧。
        NSPhotoLibraryUsageDescription: 用于选择图片进行以图搜番，或保存视频截图。
        NSPhotoLibraryAddUsageDescription: 用于把播放器截图保存到相册。
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.kazumi
        PRODUCT_NAME: $(TARGET_NAME)
        # 版本号与 pubspec.yaml 的 `version: 2.4.8+20408` 保持一致。
        MARKETING_VERSION: "2.4.8"
        CURRENT_PROJECT_VERSION: "20408"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        INFOPLIST_FILE: Runner/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        DEVELOPMENT_ASSET_PATHS: ""
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES

    dependencies:
      # XHTML / XPath 解析（libxml2），对应原项目 xpath_selector 的职责。
      - package: Fuzi
      # 播放内核（含 FFmpeg / mpv），支持 http-header-fields 与 GLSL 滤镜注入。
      - package: KSPlayer
        product: KSPlayer

  RunnerTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: RunnerTests
    dependencies:
      - target: Runner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.kazumi.RunnerTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"

schemes:
  Runner:
    build:
      targets:
        Runner: all
        RunnerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: RunnerTests
          parallelizable: true
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
