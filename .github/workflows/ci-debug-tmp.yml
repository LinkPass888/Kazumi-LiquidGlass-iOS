---
name: "ci-debug"

on:
  workflow_dispatch:
  push:
    branches:
      - "feat/update-times-notifications"

env:
  HEAD_BRANCH: "feat/update-times-notifications"

jobs:
  debug:
    runs-on: "ubuntu-latest"
    permissions: write-all
    env:
      TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
      - name: Get Flutter dependencies
        run: flutter pub get
      - name: Analyze Flutter project
        run: flutter analyze > analyze.log 2>&1 || true
      - name: Run Flutter tests
        run: flutter test > test.log 2>&1 || true
      - name: Post logs to PR
        run: python3 .github/ci-debug/post.py
