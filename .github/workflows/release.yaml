---
name: "release"

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'

env:
  SCHEME: Runner
  PROJECT: ios/Runner.xcodeproj
  # 规则开发者凭据在原生版本中通过 Keychain / Info.plist 注入，这里保留同一套 Secret 出口。
  DANDANAPI_APPID: ${{ secrets.DANDANAPI_APPID }}
  DANDANAPI_KEY: ${{ secrets.DANDANAPI_KEY }}
  KAZUMI_APPID: ${{ secrets.KAZUMI_APPID }}
  KAZUMI_KEY: ${{ secrets.KAZUMI_KEY }}

jobs:
  build-ios:
    name: "Release for iOS"
    runs-on: "macos-26"
    permissions:
      contents: read
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Extract tag name
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Echo build progress
        run: echo "Kazumi_ios_${{ env.tag }}.ipa build progress"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install build tools
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        run: xcodegen generate --spec ios/project.yml --project ios

      - name: Resolve Swift Packages
        run: |
          set -o pipefail
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -resolvePackageDependencies \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" | xcbeautify

      - name: Build archive (no codesign)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Kazumi.xcarchive" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            | xcbeautify

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/Kazumi.xcarchive/Products/Applications/Runner.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "未找到 Runner.app：$APP_PATH" >&2
            exit 1
          fi
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/Runner.app
          # 无签名打包：对嵌入的动态库做 ad-hoc 签名，便于侧载安装。
          find Payload/Runner.app -type d -name "*.framework" -exec codesign --force --sign - {} \;
          find Payload/Runner.app -type f -name "*.dylib" -exec codesign --force --sign - {} \;
          zip -q -r "Kazumi_ios_${{ env.tag }}_no_sign.ipa" Payload
          ls -lh "Kazumi_ios_${{ env.tag }}_no_sign.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios_outputs
          path: Kazumi_ios_*.ipa
          if-no-files-found: error

  release:
    name: "Release"
    runs-on: "ubuntu-latest"
    needs: [build-ios]
    permissions:
      contents: write
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Extract tag name
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
        shell: bash

      - name: Extract release notes from CHANGELOG
        run: |
          version="${tag#v}"
          awk -v v="$version" '
            index($0, "## " v " ") == 1 { found = 1; next }
            found && (index($0, "## ") == 1 || $0 == "### 构建") { exit }
            found { sub(/\r$/, ""); print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "Kazumi ${tag}" > RELEASE_NOTES.md
          fi
          echo "---------- release notes ----------"
          cat RELEASE_NOTES.md
        shell: bash

      - name: Download IPA
        uses: actions/download-artifact@v4
        with:
          name: ios_outputs
          path: ios_outputs

      - name: List files in ios_outputs directory
        run: ls -l ios_outputs

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            ios_outputs/Kazumi_ios_*.ipa
