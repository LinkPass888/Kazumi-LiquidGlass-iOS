name: kazumi
description: "A new Flutter project."
publish_to: "none"
version: 2.4.8+20408

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: 3.47.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  native_glass_navbar: ^1.2.0
  flutter_modular: ^7.1.0
  mobx: ^2.6.0
  flutter_mobx: ^2.3.0
  dio: ^5.11.0
  cookie_jar: ^4.0.9
  crypto: ^3.0.6
  connectivity_plus: ^6.0.5

  path_provider: ^2.1.5
  hive_ce: ^2.16.0
  hive_ce_flutter: ^2.3.3
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  ech_http: ^0.2.1
  http: ^1.6.0
  image: ^4.8.0
  file_picker: ^10.3.7

  flutter_volume_controller: ^2.0.1
  audio_video_progress_bar: ^2.0.2
  audio_service: ^0.18.15
  audio_session: ^0.2.2

  url_launcher: ^6.3.0
  xpath_selector: ^3.0.2
  xpath_selector_html_parser: ^3.0.1
  json_path: ^0.9.0

  canvas_danmaku: ^0.3.3
  webdav_client: ^1.2.2
  dlna_dart: ^0.0.8
  logger: ^2.6.2
  flutter_rating_bar: ^4.0.1
  scrollview_observer: ^1.22.0
  saver_gallery: ^4.1.0
  screen_brightness_ios: ^2.1.2
  screen_brightness_platform_interface: ^2.1.0
  synchronized: any
  flutter_svg: ^2.2.3
  antlr4: ^4.13.2
  fl_chart: ^1.1.1

  # 追番更新提醒（iOS 本地通知）。
  flutter_local_notifications: ^19.4.2
  timezone: ^0.10.1
  app_settings: ^7.0.0
  skeletonizer: ^2.1.2
  flutter_inappwebview_platform_interface: ^1.3.0+1
  flutter_inappwebview_ios: ^1.1.2
  upgrader: ^12.3.0
  open_filex: ^4.7.0
  html: any
  material_color_utilities: any
  material_new_shapes: ^1.0.0
  path: any
  photo_view: ^0.15.0
  image_picker: ^1.2.1
  media_kit:
    git:
      url: https://github.com/Predidit/media-kit.git
      ref: 6b188ae978808a63e5b58b7ce61f7725238c04c5
      path: ./media_kit
  media_kit_video:
    git:
      url: https://github.com/Predidit/media-kit.git
      ref: 6b188ae978808a63e5b58b7ce61f7725238c04c5
      path: ./media_kit_video

dev_dependencies:
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  mobx_codegen: ^2.7.5
  hive_ce_generator: ^1.10.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.3

flutter_launcher_icons:
  ios: true
  remove_alpha_ios: true
  image_path_ios: assets/images/logo/logo_ios.png

flutter_native_splash:
  android: false
  ios: true
  web: false
  color_ios: "#ffffff"
  color_dark_ios: "#212121"
  image_ios: assets/images/logo/logo_ios.png
  image_dark_ios: assets/images/logo/logo_ios.png

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/shaders/
    - assets/images/logo/
    - assets/statements/
    - licenses/ech_http/
    - licenses/bangumi-data/
